spring.application.name=account-service
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ridelink_account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
ridelink.jwt.secret=${JWT_SECRET}
ridelink.jwt.expiration-minutes=120
springdoc.swagger-ui.path=/swagger-ui.html
