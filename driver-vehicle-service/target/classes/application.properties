spring.application.name=driver-vehicle-service
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/ridelink_driver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
ridelink.jwt.secret=${JWT_SECRET}
