spring.application.name=fare-payment-service
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/ridelink_fare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
ridelink.jwt.secret=${JWT_SECRET}
ridelink.fare.base=300.00
ridelink.fare.per-km=100.00
